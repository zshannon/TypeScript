name: Compiler packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate source and public modules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from the compiler module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tsc/go.mod
          cache-dependency-path: |
            tsc/go.sum
            public/go.sum

      - name: Test public module generator
        run: go test ./scripts/export-go.go ./scripts/export-go_test.go

      - name: Check committed generated module
        run: |
          set -euo pipefail
          go run ./scripts/export-go.go --check
          go run ./scripts/export-go.go
          generated_status=$(git status --porcelain --untracked-files=all -- public)
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status" >&2
            echo "Generated public module is stale or contains untracked output." >&2
            exit 1
          fi

      - name: Test compiler regressions
        run: GOWORK=off go -C tsc test ./internal/compiler ./internal/tracing ./internal/project ./internal/lsp/lspwatcher

      - name: Test upstream sync automation
        run: |
          bash -n .github/scripts/merge-typescript-upstream.sh
          bash -n .github/scripts/test-merge-typescript-upstream.sh
          .github/scripts/test-merge-typescript-upstream.sh

      - name: Test external public-module consumer
        run: scripts/test-public-module.sh

      - name: Cross-build every public package
        run: |
          set -euo pipefail
          cd public
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 GOWORK=off go build ./...
          done
