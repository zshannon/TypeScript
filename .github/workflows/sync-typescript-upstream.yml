name: Sync stable TypeScript releases

on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: typescript-upstream-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Find stable release updates with Renovate
        uses: renovatebot/github-action@v46.2.6
        with:
          token: ${{ github.token }}
          configurationFile: .github/renovate-bot.json
          renovate-version: 44.69.12
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tsc/go.mod
          cache-dependency-path: tsc/go.sum
      - name: Merge release source into Renovate update PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prepare-stable-update.sh
